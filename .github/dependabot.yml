version: 2
updates:
  # npm — this is an npm-workspaces monorepo with a SINGLE hoisted root
  # package-lock.json, so one "/" entry updates the root, backend, and frontend
  # manifests together (the documented config for npm workspaces). Adding
  # separate /backend and /frontend entries would look for lockfiles that do
  # not exist there.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut review noise;
      # major bumps still open individually.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the pinned GitHub Actions (checkout, setup-node, codeql, gitleaks)
  # current — stale actions are their own supply-chain risk.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
